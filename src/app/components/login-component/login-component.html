<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="//netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.min.css">
<div class="container login-register">
  <div class="row justify-content-center">
    <div class="col-md-4 col-lg-4">
      <img src="https://bootdey.com/img/Content/avatar/avatar7.png" class="user-avatar img-thumbnail mb-3">
      <h1 class="text-center">Iw Email Sender Login</h1>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <div class="form-group">
          <input type="text" class="form-control input-underline input-lg mb-2" placeholder="Email" name="email" [(ngModel)]="email" required>
        </div>
        <div class="form-group">
          <input type="password" class="form-control input-underline input-lg mb-2" placeholder="Password" name="password" [(ngModel)]="password" required>
        </div>
        <button type="submit" class="btn btn-info btn-lg w-100 mb-2">Log in</button>
        <button type="button" class="btn btn-secondary btn-lg w-100" routerLink="/register">Register</button>
      </form>
    </div>
  </div>
</div>
