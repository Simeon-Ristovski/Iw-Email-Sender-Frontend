<div class="container" id="main-container">
  <div class="d-flex flex-column align-items-center gap-3" style="margin: 50px 0;">
    <div class="d-flex align-items-center gap-3">

      <h3 class="m-0 title" style="margin: 15px;">PROFILE INFO</h3>
    </div>
    <div class="d-flex align-items-center gap-2">
    </div>
  </div>


  <div class="row justify-content-center">
    <div #cardRef class="col-md-10 col-xl-6 mb-4 d-flex justify-content-center">
      <div id="lista" class="card h-100">
        <div class="card-body text-center">
          <p class="card-text title" style="font-weight: bold;">Name:</p>
          <p class="card-title info" style="color:black;">{{loggedUser?.firstName}}</p>

          <p class="card-text title" style="font-weight: bold;">Surname:</p>
          <p class="card-title info" style="color:black;">{{loggedUser?.lastName}}</p>

          <p class="card-text title" style="font-weight: bold;">Email:</p>
          <p class="card-title info" style="color:black;">{{loggedUser?.email}}</p>
          <div>
            <p class="card-text title" style="font-weight: bold;">Roles:</p>
            <div *ngFor="let role of loggedUser.roles">
              <p class="card-title info" style="color:black;">{{role}}</p>
            </div>

            <div class="card-body">
              <div class="float-right btn-group btn-group-sm">
                <div class="float-right btn-group btn-group-sm">
                  <div class="d-flex justify-content-center align-items-center" style="width: 470px;">
                    <button style="margin: 15px;" type="button" class="btn btn-secondary"
                      (click)="onOpenModal(editAccount, 'edit')">
                      Edit
                    </button>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>





  <!-- Edit Modal -->
  <div class="modal fade" id="editAccountModal" tabindex="-1" role="dialog"
    aria-labelledby="editAccountModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editAccountModalLabel">Edit Email job </h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form #editInfoForm="ngForm" (ngSubmit)="onEditEmailJob(editInfoForm,editAccount.uuid)">

            <div class="form-group">
              <label for="name">Name:</label>
              <input type="text" ngModel name="firstName" class="form-control" id="firstName" placeholder="Name:"
                required>
            </div>
            <div class="form-group">
              <label for="name">Surname:</label>
              <input type="text" ngModel name="lastName" class="form-control" id="lastName" placeholder="Surname:"
                required>
            </div>
            <div class="form-group">
              <label for="name">Email:</label>
              <input type="text" ngModel name="email" class="form-control" id="email" placeholder="Email:" required>
            </div>
            <div class="form-group">
              <label for="name">Password:</label>
              <input type="password" ngModel name="password" class="form-control" id="password" placeholder="Password:"
                required>
            </div>


            <div class="modal-footer">
              <button type="button" id='edit-info-acc-form' data-dismiss="modal"
                class="btn btn-secondary">Close</button>
              <button type="submit" [disabled]="editInfoForm.invalid" class="btn btn-primary">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
